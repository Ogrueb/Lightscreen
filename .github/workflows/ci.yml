name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check one-file-per-entry layout
        run: .github/scripts/check-docs.sh

  linux:
    name: Linux (Qt 5, apt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev libqt5x11extras5-dev \
            libqt5sql5-sqlite libx11-dev libxcb-keysyms1-dev xvfb xdotool

      - name: Build
        run: |
          mkdir build
          cd build
          qmake ../lightscreen.pro
          make -j"$(nproc)"

      - name: Smoke test (start under Xvfb, stop with --quit)
        working-directory: build
        shell: bash
        run: |
          cat > smoke.sh <<'SMOKE'
          set -euo pipefail
          # A config.ini next to the binary puts the app in portable mode, so the
          # run never touches the user settings. With file/format set the first-run
          # options dialog is skipped; tray=false needs no system tray; the updater
          # is disabled so the smoke makes no network calls.
          shots="$(mktemp -d)"
          printf '[file]\nformat=0\nenabled=true\ntarget=%s\n\n[options]\ntray=false\ndisableUpdater=true\n' "$shots" > config.ini
          ./lightscreen &
          pid=$!
          sleep 2
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "lightscreen exited before --quit was sent"
            wait "$pid" || true
            exit 1
          fi
          # SingleApplication forwards the argument to the running instance.
          ./lightscreen --quit
          for _ in $(seq 1 100); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "lightscreen did not exit within 10 seconds of --quit"
            kill -9 "$pid"
            exit 1
          fi
          status=0
          wait "$pid" || status=$?
          echo "lightscreen exit status: $status"
          [ "$status" -eq 0 ] || exit "$status"
          # Bug 29: with no instance running, --quit must exit instead of staying up hidden.
          status=0
          timeout 10 ./lightscreen --quit || status=$?
          if [ "$status" -ne 0 ]; then
            echo "lightscreen --quit with no instance running did not exit cleanly (status $status, 124 is a timeout)"
            exit 1
          fi
          SMOKE
          xvfb-run -a bash smoke.sh

      - name: Hotkey smoke (Print Screen under Xvfb saves a screenshot)
        working-directory: build
        shell: bash
        run: |
          cat > hotkey-smoke.sh <<'SMOKE'
          set -euo pipefail
          # Same portable config as the smoke test, plus the whole-screen action on
          # Print. xdotool sends the key through the X server, so this exercises the
          # UGlobalHotkeys key grab and its native event filter end to end.
          shots="$(mktemp -d)"
          printf '[file]\nformat=0\nenabled=true\ntarget=%s\n\n[options]\ntray=false\ndisableUpdater=true\n\n[actions]\nscreen\\enabled=true\nscreen\\hotkey=Print\n' "$shots" > config.ini
          ./lightscreen &
          pid=$!
          sleep 2
          xdotool key Print
          found=""
          for _ in $(seq 1 100); do
            found="$(find "$shots" -name '*.png' -print -quit)"
            [ -n "$found" ] && break
            sleep 0.1
          done
          ./lightscreen --quit
          status=0
          wait "$pid" || status=$?
          if [ -z "$found" ]; then
            echo "Print Screen did not save a screenshot within 10 seconds"
            exit 1
          fi
          echo "saved $found"
          [ "$status" -eq 0 ] || exit "$status"
          SMOKE
          xvfb-run -a bash hotkey-smoke.sh

      - name: Build tests
        run: |
          mkdir build-tests
          cd build-tests
          qmake ../tests/tests.pro
          make -j"$(nproc)"

      - name: Run tests (Xvfb)
        working-directory: build-tests
        run: xvfb-run -a make check

  windows:
    name: Windows (Qt 5.15.2, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\lightscreen.pro CONFIG+=release
          if errorlevel 1 exit /b 1
          nmake
          if errorlevel 1 exit /b 1

      - name: Build tests
        shell: cmd
        run: |
          mkdir build-tests
          cd build-tests
          qmake ..\tests\tests.pro CONFIG+=release
          if errorlevel 1 exit /b 1
          nmake
          if errorlevel 1 exit /b 1

      - name: Run tests (offscreen)
        shell: cmd
        working-directory: build-tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: nmake check

      - name: Deploy
        shell: cmd
        run: |
          mkdir deploy
          copy build\release\lightscreen.exe deploy\
          windeployqt --release --no-translations deploy\lightscreen.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: lightscreen-win64
          path: deploy/
          if-no-files-found: error
