name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Qt 5, apt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtbase5-private-dev qtmultimedia5-dev libqt5x11extras5-dev \
            libqt5sql5-sqlite libx11-dev libxcb-keysyms1-dev xvfb

      - name: Build
        run: |
          mkdir build
          cd build
          qmake ../lightscreen.pro
          make -j"$(nproc)"

      - name: Smoke test (start under Xvfb, stop with --quit)
        working-directory: build
        shell: bash
        run: |
          cat > smoke.sh <<'SMOKE'
          set -euo pipefail
          # A config.ini next to the binary puts the app in portable mode, so the
          # run never touches the user settings. With file/format set the first-run
          # options dialog is skipped; tray=false needs no system tray; the updater
          # is disabled so the smoke makes no network calls.
          shots="$(mktemp -d)"
          printf '[file]\nformat=0\nenabled=true\ntarget=%s\n\n[options]\ntray=false\ndisableUpdater=true\n' "$shots" > config.ini
          ./lightscreen &
          pid=$!
          sleep 2
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "lightscreen exited before --quit was sent"
            wait "$pid" || true
            exit 1
          fi
          # SingleApplication forwards the argument to the running instance.
          ./lightscreen --quit
          for _ in $(seq 1 100); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "lightscreen did not exit within 10 seconds of --quit"
            kill -9 "$pid"
            exit 1
          fi
          status=0
          wait "$pid" || status=$?
          echo "lightscreen exit status: $status"
          exit "$status"
          SMOKE
          xvfb-run -a bash smoke.sh

  windows:
    name: Windows (Qt 5.15.2, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\lightscreen.pro CONFIG+=release
          if errorlevel 1 exit /b 1
          nmake
          if errorlevel 1 exit /b 1

      - name: Deploy
        shell: cmd
        run: |
          mkdir deploy
          copy build\release\lightscreen.exe deploy\
          windeployqt --release --no-translations deploy\lightscreen.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: lightscreen-win64
          path: deploy/
          if-no-files-found: error
